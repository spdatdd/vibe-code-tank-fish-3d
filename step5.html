<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bể cá 3D — Bước 5: Tương tác</title>
<style>

    margin: 0;
    padding: 0;

    font-size: 13px;

    position: absolute;

    padding: 12px;
    border-radius: 10px;

    color: #e6f4ff;

  button.secondary {

    font-size: 12px;
    color: #9ed4ff;
    display: flex;
    justify-content: space-between;

    color: #ffd480;
    min-height: 16px;
  }

<div id="info">
  <b>Bước 5: Tương tác</b><br/>

  • Dùng bảng điều khiển góc phải để thêm/bớt cá hoặc đổi chế độ Ngày/Đêm.<br/>

<!-- Dùng Three.js qua CDN miễn phí (jsdelivr), bản ES Module -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  }
}

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ----------------------------------------------------------------------
// 1. SCENE / CAMERA / RENDERER (Nền tối kiểu đáy đại dương)
// ----------------------------------------------------------------------
const NIGHT_BG = 0x020c18;
const DAY_BG = 0x4ba8cf;

const scene = new THREE.Scene();
scene.background = new THREE.Color(NIGHT_BG);
scene.fog = new THREE.FogExp2(NIGHT_BG, 0.032);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(0, 4, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

// ----------------------------------------------------------------------
// 2. KÍCH THƯỚC BỂ CÁ
// ----------------------------------------------------------------------
const TANK = { width: 8, height: 5, depth: 4.5 };
const FLOOR_Y = -TANK.height / 2;

// ----------------------------------------------------------------------
// 3. ÁNH SÁNG
// ----------------------------------------------------------------------
const ambient = new THREE.AmbientLight(0x285a8a, 0.5);
scene.add(ambient);

const mainLight = new THREE.DirectionalLight(0xbfe9ff, 1.15);
mainLight.position.set(0, 8, 2);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(1024, 1024);
mainLight.shadow.camera.near = 1;
mainLight.shadow.camera.far = 20;
mainLight.shadow.camera.left = -6;
mainLight.shadow.camera.right = 6;
mainLight.shadow.camera.top = 6;
mainLight.shadow.camera.bottom = -6;
scene.add(mainLight);

const rimLight = new THREE.PointLight(0x1b6ef3, 0.75, 22);
rimLight.position.set(-3, 3, -4);
scene.add(rimLight);

const depthGlow = new THREE.PointLight(0x0d94b8, 0.45, 16);
depthGlow.position.set(2.5, 1.8, 2.5);
scene.add(depthGlow);

// ----------------------------------------------------------------------
// 4. NỀN BỂ — SỎI / CÁT TRẮNG
// ----------------------------------------------------------------------
const floorGeo = new THREE.PlaneGeometry(TANK.width, TANK.depth, 32, 32);
const posAttr = floorGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++) {
  const z = posAttr.getZ(i);
  posAttr.setZ(i, z + (Math.random() - 0.5) * 0.06);
}
floorGeo.computeVertexNormals();

const floorMat = new THREE.MeshStandardMaterial({
  color: 0xd8cfba,
  roughness: 0.95,
  metalness: 0.0,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.receiveShadow = true;
scene.add(floor);

// ----------------------------------------------------------------------
// 5. BỂ KÍNH TRONG SUỐT
// ----------------------------------------------------------------------
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfe8ff,
  transparent: true,
  opacity: 0.12,
  roughness: 0.05,
  metalness: 0.0,
  transmission: 0.9,
  thickness: 0.2,
  side: THREE.DoubleSide,
  depthWrite: false,
});

const tankGeo = new THREE.BoxGeometry(TANK.width, TANK.height, TANK.depth);
const tankGlass = new THREE.Mesh(tankGeo, glassMat);
scene.add(tankGlass);

const edges = new THREE.EdgesGeometry(tankGeo);
const frameMat = new THREE.LineBasicMaterial({ color: 0x0a1a2a, linewidth: 2 });
const frame = new THREE.LineSegments(edges, frameMat);
scene.add(frame);

// ----------------------------------------------------------------------
// 6. MẶT NƯỚC (gợn sóng nhẹ)
// ----------------------------------------------------------------------
const waterTopGeo = new THREE.PlaneGeometry(TANK.width * 0.98, TANK.depth * 0.98, 28, 18);
const waterTopBaseZ = new Float32Array(waterTopGeo.attributes.position.count);
for (let i = 0; i < waterTopBaseZ.length; i++) {
  waterTopBaseZ[i] = waterTopGeo.attributes.position.getZ(i);
}
const waterTopMat = new THREE.MeshPhysicalMaterial({
  color: 0x5fc9e8,
  transparent: true,
  opacity: 0.26,
  roughness: 0.1,
  transmission: 0.6,
  side: THREE.DoubleSide,
});
const waterTop = new THREE.Mesh(waterTopGeo, waterTopMat);
waterTop.rotation.x = -Math.PI / 2;
waterTop.position.y = TANK.height / 2 - 0.05;
scene.add(waterTop);

// ----------------------------------------------------------------------
// 7. TRANG TRÍ NỀN BỂ (san hô, vỏ ốc, đá sỏi)
// ----------------------------------------------------------------------
const decor = new THREE.Group();
scene.add(decor);

const coralMat = new THREE.MeshStandardMaterial({
  color: 0xf3ead9,
  roughness: 0.85,
  metalness: 0.0,
});

function buildCoralBranch(length, radius, depth) {
  const group = new THREE.Group();
  const segGeo = new THREE.CylinderGeometry(radius * 0.45, radius, length, 6);
  const segMesh = new THREE.Mesh(segGeo, coralMat);
  segMesh.position.y = length / 2;
  segMesh.castShadow = true;
  segMesh.receiveShadow = true;
  group.add(segMesh);

  if (depth > 0) {
    const numBranches = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < numBranches; i++) {
      const child = buildCoralBranch(
        length * (0.6 + Math.random() * 0.15),
        radius * 0.6,
        depth - 1
      );
      child.position.y = length * (0.7 + Math.random() * 0.25);
      child.rotation.z = (Math.random() - 0.5) * 1.4 + (i % 2 === 0 ? 0.5 : -0.5);
      child.rotation.x = (Math.random() - 0.5) * 0.8;
      child.rotation.y = Math.random() * Math.PI * 2;
      group.add(child);
    }
  }
  return group;
}

function createCoralCluster() {
  const cluster = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const branch = buildCoralBranch(0.9 + Math.random() * 0.3, 0.09, 3);
    branch.position.set((Math.random() - 0.5) * 0.5, 0, (Math.random() - 0.5) * 0.5);
    branch.rotation.y = Math.random() * Math.PI * 2;
    branch.rotation.z = (Math.random() - 0.5) * 0.3;
    cluster.add(branch);
  }
  return cluster;
}

const coral1 = createCoralCluster();
coral1.position.set(-TANK.width / 2 + 1.1, FLOOR_Y, -0.3);
coral1.scale.setScalar(1.15);
decor.add(coral1);

const coral2 = createCoralCluster();
coral2.position.set(-TANK.width / 2 + 1.9, FLOOR_Y, 0.9);
coral2.scale.setScalar(0.8);
decor.add(coral2);

const brainMat = new THREE.MeshStandardMaterial({
  color: 0xc9c6bf,
  roughness: 0.95,
  metalness: 0.0,
});

function createBrainCoral(radius) {
  const geo = new THREE.IcosahedronGeometry(radius, 3);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    const fold =
      Math.sin(v.x * 9 + v.y * 3) * Math.cos(v.z * 9 - v.y * 2) * 0.06 +
      Math.sin(v.y * 14) * 0.02;
    v.addScaledVector(n, fold);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, brainMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const brain1 = createBrainCoral(0.55);
brain1.position.set(-0.6, FLOOR_Y + 0.4, -0.2);
decor.add(brain1);

const brain2 = createBrainCoral(0.32);
brain2.position.set(0.3, FLOOR_Y + 0.22, 0.8);
decor.add(brain2);

const shellMat = new THREE.MeshStandardMaterial({
  color: 0xd9c49a,
  roughness: 0.6,
  metalness: 0.05,
});

function createShell(turns, height, startRadius) {
  const points = [];
  const steps = 120;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const angle = t * Math.PI * 2 * turns;
    const r = startRadius * (1 - t * 0.92);
    const y = t * height;
    points.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const tubeGeo = new THREE.TubeGeometry(curve, 160, startRadius * 0.38, 8, false);
  const shell = new THREE.Mesh(tubeGeo, shellMat);
  shell.castShadow = true;
  shell.receiveShadow = true;

  const tipGeo = new THREE.ConeGeometry(startRadius * 0.15, height * 0.25, 8);
  const tip = new THREE.Mesh(tipGeo, shellMat);
  tip.position.y = height * 1.02;
  tip.castShadow = true;
  shell.add(tip);

  return shell;
}

const shell = createShell(3.2, 0.9, 0.45);
shell.rotation.x = Math.PI * 0.42;
shell.position.set(1.6, FLOOR_Y + 0.08, 1.2);
decor.add(shell);

const rockMat = new THREE.MeshStandardMaterial({
  color: 0x7c8086,
  roughness: 1.0,
  metalness: 0.0,
});
const pebbleMat = new THREE.MeshStandardMaterial({
  color: 0x9a9690,
  roughness: 0.9,
  metalness: 0.0,
});

function createRock(radius) {
  const geo = new THREE.IcosahedronGeometry(radius, 1);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    v.multiplyScalar(1 + (Math.random() - 0.5) * 0.25);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, rockMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const rockPositions = [
  { x: 0.9, z: -0.8, r: 0.5, sy: 0.7 },
  { x: 1.6, z: -0.3, r: 0.35, sy: 0.8 },
  { x: 2.6, z: 0.3, r: 0.6, sy: 0.65 },
  { x: 3.1, z: -0.9, r: 0.4, sy: 0.75 },
  { x: -0.2, z: 1.3, r: 0.3, sy: 0.7 },
];
for (const p of rockPositions) {
  const rock = createRock(p.r);
  rock.scale.y = p.sy;
  rock.position.set(p.x, FLOOR_Y + p.r * p.sy * 0.55, p.z);
  rock.rotation.y = Math.random() * Math.PI * 2;
  decor.add(rock);
}

for (let i = 0; i < 18; i++) {
  const r = 0.05 + Math.random() * 0.06;
  const geo = new THREE.IcosahedronGeometry(r, 0);
  const pebble = new THREE.Mesh(geo, pebbleMat);
  pebble.position.set(
    (Math.random() - 0.5) * (TANK.width - 0.6),
    FLOOR_Y + r * 0.4,
    (Math.random() - 0.5) * (TANK.depth - 0.6)
  );
  pebble.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  pebble.castShadow = true;
  pebble.receiveShadow = true;
  decor.add(pebble);
}

// ----------------------------------------------------------------------
// 8. CÁ BƠI ĐỘNG
// ----------------------------------------------------------------------
function makeFin(size, color) {
  const finGeo = new THREE.ConeGeometry(size, size * 1.6, 3);
  const finMat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.6,
    side: THREE.DoubleSide,
  });
  const fin = new THREE.Mesh(finGeo, finMat);
  fin.scale.z = 0.08;
  fin.castShadow = true;
  return fin;
}

function createFish(type) {
  const isClown = type === "clown";
  const bodyColor = isClown ? 0xff7a1f : 0xffa23d;
  const finColor = isClown ? 0xe85d00 : 0xff8c3d;

  const group = new THREE.Group();

  const profilePts = [
    new THREE.Vector2(0.0, -0.55),
    new THREE.Vector2(0.05, -0.42),
    new THREE.Vector2(0.14, -0.22),
    new THREE.Vector2(0.2, -0.02),
    new THREE.Vector2(0.19, 0.16),
    new THREE.Vector2(0.13, 0.32),
    new THREE.Vector2(0.06, 0.44),
    new THREE.Vector2(0.0, 0.5),
  ];
  const bodyGeo = new THREE.LatheGeometry(profilePts, 10);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColor,
    roughness: 0.5,
    metalness: 0.1,
  });
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  bodyMesh.scale.x = 0.55;
  bodyMesh.castShadow = true;
  group.add(bodyMesh);

  const eyeGeo = new THREE.SphereGeometry(0.035, 6, 6);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(0.16 * side, 0.34, 0.1);
    bodyMesh.add(eye);
  }

  if (isClown) {
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });

    function addStripe(yPos, radius) {
      const ring = new THREE.Group();
      const white = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, 0.1, 10, 1, true),
        whiteMat
      );
      white.position.y = yPos;
      const blackA = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 1.01, radius * 1.01, 0.03, 10, 1, true),
        blackMat
      );
      blackA.position.y = yPos - 0.055;
      const blackB = blackA.clone();
      blackB.position.y = yPos + 0.055;
      ring.add(white, blackA, blackB);
      bodyMesh.add(ring);
    }
    addStripe(0.12, 0.205);
    addStripe(-0.14, 0.21);
  }

  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, -0.5, 0);
  const tailFin = makeFin(0.3, finColor);
  tailFin.rotation.x = Math.PI / 2;
  tailFin.position.set(0, -0.14, 0);
  tailPivot.add(tailFin);
  group.add(tailPivot);

  const dorsal = makeFin(0.16, finColor);
  dorsal.rotation.x = Math.PI / 2;
  dorsal.position.set(0, 0.05, 0.14);
  group.add(dorsal);

  const pecL = makeFin(0.1, finColor);
  pecL.rotation.z = Math.PI / 2;
  pecL.position.set(-0.13, 0.02, 0.05);
  group.add(pecL);

  const pecR = makeFin(0.1, finColor);
  pecR.rotation.z = -Math.PI / 2;
  pecR.position.set(0.13, 0.02, 0.05);
  group.add(pecR);

  return { group, tailPivot, bodyMat };
}

const SWIM_BOUNDS = {
  xMin: -TANK.width / 2 + 0.6,
  xMax: TANK.width / 2 - 0.6,
  yMin: FLOOR_Y + 0.7,
  yMax: TANK.height / 2 - 0.9,
  zMin: -TANK.depth / 2 + 0.5,
  zMax: TANK.depth / 2 - 0.5,
};

function randomPointInTank() {
  return new THREE.Vector3(
    THREE.MathUtils.randFloat(SWIM_BOUNDS.xMin, SWIM_BOUNDS.xMax),
    THREE.MathUtils.randFloat(SWIM_BOUNDS.yMin, SWIM_BOUNDS.yMax),
    THREE.MathUtils.randFloat(SWIM_BOUNDS.zMin, SWIM_BOUNDS.zMax)
  );
}

class Fish {
  constructor(type) {
    const built = createFish(type);
    this.type = type;
    this.group = built.group;
    this.tailPivot = built.tailPivot;
    this.bodyMat = built.bodyMat;

    // Gắn tham chiếu để raycaster nhận diện con cá khi click
    this.group.traverse((child) => {
      child.userData.fish = this;
    });

    this.position = randomPointInTank();
    this.target = randomPointInTank();
    this.velocity = new THREE.Vector3();
    this.baseSpeed = THREE.MathUtils.randFloat(0.55, 1.1);
    this.speed = this.baseSpeed;
    this.wagPhase = Math.random() * Math.PI * 2;
    this.isFollowing = false;

    const scale = THREE.MathUtils.randFloat(0.85, 1.3);
    this.group.scale.setScalar(scale);
    this.group.position.copy(this.position);

    scene.add(this.group);
  }

  setHighlighted(active) {
    this.isFollowing = active;
    this.bodyMat.emissive.setHex(active ? 0x336699 : 0x000000);
    this.speed = active ? Math.max(this.baseSpeed * 1.6, 1.45) : this.baseSpeed;
  }

  dispose() {
    scene.remove(this.group);
  }

  update(dt, elapsed) {
    const toTarget = this.target.clone().sub(this.position);
    const dist = toTarget.length();
    if (!this.isFollowing && dist < 0.35) {
      this.target = randomPointInTank();
    }

    if (dist > 0.05) {
      const desired = toTarget.normalize().multiplyScalar(this.speed);
      this.velocity.lerp(desired, this.isFollowing ? 0.06 : 0.025);
    } else if (this.isFollowing) {
      // Giảm tốc nhẹ khi đã tới sát con trỏ
      this.velocity.multiplyScalar(0.92);
    }

    this.position.addScaledVector(this.velocity, dt);
    this.position.x = THREE.MathUtils.clamp(this.position.x, SWIM_BOUNDS.xMin, SWIM_BOUNDS.xMax);
    this.position.y = THREE.MathUtils.clamp(this.position.y, SWIM_BOUNDS.yMin, SWIM_BOUNDS.yMax);
    this.position.z = THREE.MathUtils.clamp(this.position.z, SWIM_BOUNDS.zMin, SWIM_BOUNDS.zMax);
    this.group.position.copy(this.position);

    if (this.velocity.lengthSq() > 0.0001) {
      const dir = this.velocity.clone().normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        dir
      );
      this.group.quaternion.slerp(quat, 0.09);
    }

    const wagSpeed = 6 + this.velocity.length() * 4.5;
    this.tailPivot.rotation.z = Math.sin(elapsed * wagSpeed + this.wagPhase) * 0.5;
  }
}

const fishList = [];
const INITIAL_TYPES = ["gold", "gold", "gold", "gold", "clown", "clown", "clown"];
for (const type of INITIAL_TYPES) {
  fishList.push(new Fish(type));
}

// ----------------------------------------------------------------------
// 9. HIỆU ỨNG NƯỚC (Caustics hắt sáng, Bong bóng khí, Tia sáng)
// ----------------------------------------------------------------------
const causticsUniforms = {
  uTime: { value: 0 },
  uIntensity: { value: 1.0 },
};

const causticsMat = new THREE.ShaderMaterial({
  uniforms: causticsUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uIntensity;
    varying vec2 vUv;

    float causticPattern(vec2 p, float t) {
      vec2 i = p;
      float c = 1.0;
      float inten = 0.005;
      for (int n = 0; n < 4; n++) {
        float time = t * (1.0 - (3.5 / float(n + 1)));
        i = p + vec2(
          cos(time - i.x) + sin(time + i.y),
          sin(time - i.y) + cos(time + i.x)
        );
        c += 1.0 / length(vec2(
          p.x / (sin(i.x + time) / inten),
          p.y / (cos(i.y + time) / inten)
        ));
      }
      c /= 4.0;
      c = 1.17 - pow(c, 1.4);
      return pow(abs(c), 8.0);
    }

    void main() {
      vec2 uv = vUv * vec2(5.5, 3.2);
      float c = causticPattern(uv, uTime * 0.35);
      float edgeX = smoothstep(0.0, 0.08, vUv.x) * smoothstep(1.0, 0.92, vUv.x);
      float edgeY = smoothstep(0.0, 0.08, vUv.y) * smoothstep(1.0, 0.92, vUv.y);
      float alpha = clamp(c * 0.65 * uIntensity, 0.0, 0.85) * edgeX * edgeY;
      vec3 col = mix(vec3(0.25, 0.75, 1.0), vec3(0.85, 0.98, 1.0), clamp(c, 0.0, 1.0));
      gl_FragColor = vec4(col, alpha);
    }
  `,
});

const causticsFloor = new THREE.Mesh(floorGeo, causticsMat);
causticsFloor.rotation.x = -Math.PI / 2;
causticsFloor.position.y = FLOOR_Y + 0.008;
scene.add(causticsFloor);

const rayGroup = new THREE.Group();
const rayMat = new THREE.MeshBasicMaterial({
  color: 0x6fd8ff,
  transparent: true,
  opacity: 0.035,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
});
const rayConfigs = [
  { x: -1.8, z: -0.4, topR: 0.45, botR: 1.2, rotZ: 0.12 },
  { x: 0.4, z: 0.3, topR: 0.55, botR: 1.45, rotZ: 0.08 },
  { x: 2.1, z: -0.2, topR: 0.4, botR: 1.1, rotZ: 0.1 },
];
const rayMeshes = [];
for (const rc of rayConfigs) {
  const rayGeo = new THREE.CylinderGeometry(rc.topR, rc.botR, TANK.height * 0.92, 16, 1, true);
  const ray = new THREE.Mesh(rayGeo, rayMat.clone());
  ray.position.set(rc.x, 0, rc.z);
  ray.rotation.z = rc.rotZ;
  rayGroup.add(ray);
  rayMeshes.push(ray);
}
scene.add(rayGroup);

function createBubbleTexture() {
  const size = 64;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  const cx = size / 2;
  const cy = size / 2;
  const r = size * 0.45;

  const grad = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
  grad.addColorStop(0.0, "rgba(200, 240, 255, 0.05)");
  grad.addColorStop(0.65, "rgba(180, 235, 255, 0.25)");
  grad.addColorStop(0.88, "rgba(230, 250, 255, 0.85)");
  grad.addColorStop(1.0, "rgba(255, 255, 255, 0.0)");

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
  ctx.beginPath();
  ctx.arc(cx - r * 0.32, cy - r * 0.32, r * 0.16, 0, Math.PI * 2);
  ctx.fill();

  return new THREE.CanvasTexture(canvas);
}

const BUBBLE_COUNT = 140;
const bubblePositions = new Float32Array(BUBBLE_COUNT * 3);
const bubbleBaseXZ = [];
const BUBBLE_BOUNDS = {
  xMin: -TANK.width / 2 + 0.35,
  xMax: TANK.width / 2 - 0.35,
  yMin: FLOOR_Y + 0.15,
  yMax: TANK.height / 2 - 0.12,
  zMin: -TANK.depth / 2 + 0.35,
  zMax: TANK.depth / 2 - 0.35,
};

const bubbleEmitters = [
  { x: -2.7, z: -0.3 },
  { x: 1.5, z: 1.1 },
  { x: 2.3, z: 0.1 },
];

function resetBubble(i, randomY = false) {
  let bx, bz;
  if (Math.random() < 0.65) {
    const em = bubbleEmitters[Math.floor(Math.random() * bubbleEmitters.length)];
    bx = THREE.MathUtils.clamp(em.x + (Math.random() - 0.5) * 0.55, BUBBLE_BOUNDS.xMin, BUBBLE_BOUNDS.xMax);
    bz = THREE.MathUtils.clamp(em.z + (Math.random() - 0.5) * 0.55, BUBBLE_BOUNDS.zMin, BUBBLE_BOUNDS.zMax);
  } else {
    bx = THREE.MathUtils.randFloat(BUBBLE_BOUNDS.xMin, BUBBLE_BOUNDS.xMax);
    bz = THREE.MathUtils.randFloat(BUBBLE_BOUNDS.zMin, BUBBLE_BOUNDS.zMax);
  }
  const by = randomY
    ? THREE.MathUtils.randFloat(BUBBLE_BOUNDS.yMin, BUBBLE_BOUNDS.yMax)
    : BUBBLE_BOUNDS.yMin + Math.random() * 0.25;

  bubblePositions[i * 3] = bx;
  bubblePositions[i * 3 + 1] = by;
  bubblePositions[i * 3 + 2] = bz;

  bubbleBaseXZ[i] = {
    x: bx,
    z: bz,
    speed: THREE.MathUtils.randFloat(0.45, 1.15),
    phase: Math.random() * Math.PI * 2,
    amp: THREE.MathUtils.randFloat(0.03, 0.09),
  };
}

for (let i = 0; i < BUBBLE_COUNT; i++) {
  resetBubble(i, true);
}

const bubbleGeo = new THREE.BufferGeometry();
bubbleGeo.setAttribute("position", new THREE.BufferAttribute(bubblePositions, 3));

const bubbleMat = new THREE.PointsMaterial({
  map: createBubbleTexture(),
  size: 0.14,
  transparent: true,
  opacity: 0.85,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});

const bubbles = new THREE.Points(bubbleGeo, bubbleMat);
scene.add(bubbles);

// ----------------------------------------------------------------------
// 10. TƯƠNG TÁC (Click cá bơi theo chuột, Thêm/Bớt cá, Ngày/Đêm)
// ----------------------------------------------------------------------
const fishCountEl = document.getElementById("fish-count");
const followStatusEl = document.getElementById("follow-status");
const btnAdd = document.getElementById("btn-add");
const btnRemove = document.getElementById("btn-remove");
const btnDayNight = document.getElementById("btn-daynight");

let selectedFish = null;
let isDayMode = false;

// Vòng tròn đánh dấu vị trí con trỏ trong bể khi đang dẫn cá
const cursorMarkerGeo = new THREE.RingGeometry(0.12, 0.17, 24);
const cursorMarkerMat = new THREE.MeshBasicMaterial({
  color: 0xffd480,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.85,
});
const cursorMarker = new THREE.Mesh(cursorMarkerGeo, cursorMarkerMat);
cursorMarker.visible = false;
scene.add(cursorMarker);

function updateFishCountUI() {
  fishCountEl.textContent = String(fishList.length);
}

function selectFish(fish) {
  if (selectedFish) {
    selectedFish.setHighlighted(false);
  }
  selectedFish = fish;
  if (selectedFish) {
    selectedFish.setHighlighted(true);
    const label = selectedFish.type === "clown" ? "cá sọc clownfish" : "cá vàng cam";
    followStatusEl.textContent = `Đang dẫn ${label} theo chuột`;
    cursorMarker.position.copy(selectedFish.target);
    cursorMarker.visible = true;
  } else {
    followStatusEl.textContent = "Chưa chọn cá nào";
    cursorMarker.visible = false;
  }
}

// Thêm cá
btnAdd.addEventListener("click", () => {
  if (fishList.length >= 25) return;
  const type = Math.random() < 0.55 ? "gold" : "clown";
  fishList.push(new Fish(type));
  updateFishCountUI();
});

// Bớt cá
btnRemove.addEventListener("click", () => {
  if (fishList.length <= 0) return;
  const removed = fishList.pop();
  if (removed === selectedFish) {
    selectFish(null);
  }
  removed.dispose();
  updateFishCountUI();
});

// Chuyển chế độ Ngày / Đêm
function applyDayNightMode() {
  if (isDayMode) {
    scene.background.setHex(DAY_BG);
    scene.fog.color.setHex(DAY_BG);
    scene.fog.density = 0.016;
    ambient.color.setHex(0x9be0ff);
    ambient.intensity = 1.05;
    mainLight.color.setHex(0xfff6e5);
    mainLight.intensity = 1.85;
    rimLight.intensity = 0.35;
    depthGlow.intensity = 0.25;
    causticsUniforms.uIntensity.value = 1.35;
    btnDayNight.textContent = "Chế độ: Ngày";
  } else {
    scene.background.setHex(NIGHT_BG);
    scene.fog.color.setHex(NIGHT_BG);
    scene.fog.density = 0.032;
    ambient.color.setHex(0x285a8a);
    ambient.intensity = 0.5;
    mainLight.color.setHex(0xbfe9ff);
    mainLight.intensity = 1.15;
    rimLight.intensity = 0.75;
    depthGlow.intensity = 0.45;
    causticsUniforms.uIntensity.value = 1.0;
    btnDayNight.textContent = "Chế độ: Đêm";
  }
}

btnDayNight.addEventListener("click", () => {
  isDayMode = !isDayMode;
  applyDayNightMode();
});

// Raycasting: click chọn cá & di chuyển chuột để dẫn cá
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const planeNormal = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
let pointerDownPos = { x: 0, y: 0 };

renderer.domElement.addEventListener("pointerdown", (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener("pointerup", (e) => {
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  if (Math.hypot(dx, dy) > 6) return; // bỏ qua nếu người dùng đang xoay camera

  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  const fishGroups = fishList.map((f) => f.group);
  const hits = raycaster.intersectObjects(fishGroups, true);

  if (hits.length > 0) {
    const clickedFish = hits[0].object.userData.fish;
    if (clickedFish) {
      selectFish(clickedFish === selectedFish ? null : clickedFish);
      return;
    }
  }

  // Click ra ngoài cá -> bỏ chọn để cá bơi tự do lại
  if (selectedFish) {
    selectFish(null);
  }
});

renderer.domElement.addEventListener("pointermove", (e) => {
  if (!selectedFish) return;

  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  // Tạo mặt phẳng vuông góc với hướng nhìn camera, đi qua vị trí hiện tại của cá
  camera.getWorldDirection(planeNormal);
  dragPlane.setFromNormalAndCoplanarPoint(planeNormal, selectedFish.position);

  if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
    hitPoint.x = THREE.MathUtils.clamp(hitPoint.x, SWIM_BOUNDS.xMin, SWIM_BOUNDS.xMax);
    hitPoint.y = THREE.MathUtils.clamp(hitPoint.y, SWIM_BOUNDS.yMin, SWIM_BOUNDS.yMax);
    hitPoint.z = THREE.MathUtils.clamp(hitPoint.z, SWIM_BOUNDS.zMin, SWIM_BOUNDS.zMax);
    selectedFish.target.copy(hitPoint);
    cursorMarker.position.copy(hitPoint);
  }
});

// ----------------------------------------------------------------------
// 11. RESIZE HANDLER
// ----------------------------------------------------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ----------------------------------------------------------------------
// 12. VÒNG LẶP RENDER
// ----------------------------------------------------------------------
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  for (const fish of fishList) {
    fish.update(dt, elapsed);
  }

  if (cursorMarker.visible) {
    cursorMarker.lookAt(camera.position);
  }

  causticsUniforms.uTime.value = elapsed;

  const wPos = waterTopGeo.attributes.position;
  for (let i = 0; i < wPos.count; i++) {
    const wx = wPos.getX(i);
    const wy = wPos.getY(i);
    const wave =
      Math.sin(wx * 1.4 + elapsed * 1.6) * 0.02 +
      Math.cos(wy * 1.8 - elapsed * 1.3) * 0.015;
    wPos.setZ(i, waterTopBaseZ[i] + wave);
  }
  wPos.needsUpdate = true;
  waterTopGeo.computeVertexNormals();

  const rayBaseOpacity = isDayMode ? 0.045 : 0.025;
  for (let i = 0; i < rayMeshes.length; i++) {
    rayMeshes[i].material.opacity = rayBaseOpacity + 0.015 * Math.sin(elapsed * 0.8 + i * 2.1);
  }

  const bPos = bubbleGeo.attributes.position.array;
  for (let i = 0; i < BUBBLE_COUNT; i++) {
    const meta = bubbleBaseXZ[i];
    const y = bPos[i * 3 + 1] + meta.speed * dt;
    if (y > BUBBLE_BOUNDS.yMax) {
      resetBubble(i, false);
      continue;
    }
    bPos[i * 3] = THREE.MathUtils.clamp(
      meta.x + Math.sin(elapsed * 2.4 + meta.phase) * meta.amp,
      BUBBLE_BOUNDS.xMin,
      BUBBLE_BOUNDS.xMax
    );
    bPos[i * 3 + 1] = y;
    bPos[i * 3 + 2] = THREE.MathUtils.clamp(
      meta.z + Math.cos(elapsed * 1.9 + meta.phase) * meta.amp,
      BUBBLE_BOUNDS.zMin,
      BUBBLE_BOUNDS.zMax
    );
  }
  bubbleGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
